<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quiz</title>
    <script src="js/scripts.js" defer></script>
    <link href="css/style.css" rel ="stylesheet">
    
</head>
<body>
    <h1>Math Quiz</h1>
    <p id="scoreText"></p>
    <p id="timesText"></p>

    <div class="question">
        <p class="label">1. Which ones are prime numbers? (select all that apply)</p>
        <div id="q1choices">
            <label>
                <input id="q1A" type="checkbox" name="q1" value="3"> 3
            </label>
            <label>
                <input id="q1B" type="checkbox" name="q1" value="2"> 2
            </label>
            <label>
                <input id="q1C" type="checkbox" name="q1" value="answer3">  2026
            </label>
        </div>
        <div id="q1Text" class="feedback"></div>
    </div>

    <div class="question">
        <p class="label">2. Which one of these is a natural number?</p>
        <label><input type="radio" name="q2" value="24.56"> 24.56</label>
        <label><input type="radio" name="q2" value="ln3"> ln(3)</label>
        <label><input type="radio" name="q2" value="16"> 16</label>
        <div id="q2Text" class="feedback"></div>
    </div>

    <div class="question">
        <p class="label">3. What is 4! ?</p>
        <label>
            <input id="q3" type="text" name="q3" placeholder="Your answer">
        </label>
        <div id="q3Text" class="feedback"></div>
    </div>

    <div class="question">
        <p class="label">4. What is the area of a rectangle of base 2 and height 4?</p>
        <label><input type="radio" name="q4" value="45"> 45</label>
        <label><input type="radio" name="q4" value="8"> 8</label>
        <label><input type="radio" name="q4" value="15"> 15</label>
        <div id="q4Text" class="feedback"></div>
    </div>

    <div class="question">
        <p class="label">5. What does the mod function do?</p>
        <select name="q5" id="q5questions">
            <option value="division">division</option>
            <option value="remainder">returns the remainder</option>
            <option value="multiplication">multiplication</option>
        </select>
        <div id="q5Text" class="feedback"></div>
    </div>

    <button id="submit">Submit the Quiz</button>
    <div id="congratsTxt"></div>

</body>
</html>
