<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab5</title>
    <script src="js/scripts.js" defer></script>
    <style>
        #translate{

        }
        #randomQuoteDisplay{

            margin: 50px;
        }
