<!DOCTYPE html>
<html>
<head>
    <title> Sign Up Page </title>
    <link href="css/style.css" rel ="stylesheet">
    
</head>
<body>

<h1> Sign Up </h1>

<form id="signupForm">
    First Name: <input type="text" name="fName"><br>
    Last Name: <input type="text" name="lName"><br>
    Gender:
    <input type="radio" name="gender" value="m">Male<br>
    <input type="radio" name="gender" value="f">Female<br>
    Zip Code: <input type="text" id="zip" name="zip"><br>
    City: <span id="city"></span><br>
    Latitude: <span id="latitude"></span><br>
    Longitude: <span id="longitude"></span><br><br>

    State:
    <select id="state" name="state">
        <option value="">Select One</option>
    </select><br>

    Select a County: <select id="county"></select><br>

    Desired Username:
    <input type="text" id="username" name="username"><br>
    <span id="usernameError"></span><br>

    Password: <input type="password" id="passwordInput" name="password">
    <span id="suggestedPassword"></span><br>
    <span id="passwordLengthText"></span><br>
    Type Password Again: <input type="password" id="password2"><br>
    <span id="passwordError"></span><br>

    <input type="submit" value="Sign up!">
</form>

<script src="js/script.js"></script>
</body>
</html>
